[package]
name = "codetracer-move-recorder"
version = "0.1.0"
edition = "2024"
authors = ["Metacraft Labs Ltd"]
description = "CodeTracer recorder for Move smart contracts (Sui/Aptos)"
license = "Apache-2.0"

# Allow stylistic clippy 1.96 lints that don't meaningfully apply to
# the Move recorder's test fixture constructors and JSON path traversal
# helpers.  Same workspace-allow pattern as codetracer-solana-recorder.
[lints.clippy]
collapsible_if = "allow"
collapsible_match = "allow"
expect_fun_call = "allow"
unnecessary_map_or = "allow"
useless_vec = "allow"

[dependencies]
# CodeTracer trace format
codetracer_trace_types = { path = "../codetracer-trace-format/codetracer_trace_types" }
codetracer_trace_writer_nim = { path = "../codetracer-trace-format/codetracer_trace_writer_nim" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

# Compression (trace files are zstd-compressed)
zstd = "0.13"

# Error handling
eyre = "0.6"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Recursive directory walking (source file discovery)
walkdir = "2"

[dev-dependencies]
tempfile = "3"
