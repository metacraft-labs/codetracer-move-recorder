[package]
name = "codetracer-move-recorder"
version = "0.1.0"
edition = "2024"
authors = ["Metacraft Labs Ltd"]
description = "CodeTracer recorder for Move smart contracts (Sui/Aptos)"
license = "Apache-2.0"

[dependencies]
# CodeTracer trace format
codetracer_trace_types = "0.16"
codetracer_trace_writer = "0.17"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Compression (trace files are zstd-compressed)
zstd = "0.13"

# Error handling
eyre = "0.6"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
