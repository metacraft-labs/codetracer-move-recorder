name: CI

# Re-plays the project's deterministic dev env on the runner.
# See:
#   https://github.com/metacraft-labs/metacraft-dev-guidelines/blob/latest/policies/ci-shared-dev-env.md

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on runner
        # The Move recorder transitively pulls the Sui crate, whose
        # rocksdb-sys C++ build chews through ~10 GB of intermediate
        # objects.  The hosted Ubuntu runner ships with only ~14 GB
        # free after the OS image, so rocksdb-sys fails with
        # "No space left on device" partway through.  Strip the
        # preinstalled .NET / Android / GHC / Haskell toolchains
        # we don't need before the Nix build starts.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Clone codetracer-trace-format sibling
        run: |
          PINS=".github/sibling-pins"
          TF_REF="main"
          if [ -f "${PINS}" ]; then
            PIN="$(grep '^codetracer-trace-format ' "${PINS}" | cut -d' ' -f2)" || true
            [ -n "${PIN}" ] && TF_REF="${PIN}"
          fi
          rm -rf "${GITHUB_WORKSPACE}/../codetracer-trace-format"
          if ! git clone --depth 1 --branch "${TF_REF}" --single-branch \
            "https://github.com/metacraft-labs/codetracer-trace-format.git" \
            "${GITHUB_WORKSPACE}/../codetracer-trace-format" 2>/dev/null; then
            rm -rf "${GITHUB_WORKSPACE}/../codetracer-trace-format"
            git clone --no-checkout "https://github.com/metacraft-labs/codetracer-trace-format.git" \
              "${GITHUB_WORKSPACE}/../codetracer-trace-format"
            git -C "${GITHUB_WORKSPACE}/../codetracer-trace-format" checkout "${TF_REF}"
          fi

      - name: Clone codetracer-trace-format-nim sibling
        run: |
          PINS=".github/sibling-pins"
          TFN_REF="main"
          TFN_BRANCH=""
          if [ -f "${PINS}" ]; then
            PIN="$(grep '^codetracer-trace-format-nim ' "${PINS}" | cut -d' ' -f2)" || true
            BRANCH="$(grep '^codetracer-trace-format-nim ' "${PINS}" | cut -d' ' -f3)" || true
            [ -n "${PIN}" ] && TFN_REF="${PIN}"
            [ -n "${BRANCH}" ] && [ "${BRANCH}" != "HEAD" ] && TFN_BRANCH="${BRANCH}"
          fi
          DEST="${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"
          URL="https://github.com/metacraft-labs/codetracer-trace-format-nim.git"
          rm -rf "${DEST}"
          if [ -n "${TFN_BRANCH}" ] && git clone --depth 1 --branch "${TFN_BRANCH}" --single-branch \
            "${URL}" "${DEST}"; then
            if git -C "${DEST}" checkout "${TFN_REF}"; then
              exit 0
            fi
          fi
          rm -rf "${DEST}"
          if ! git clone --depth 1 --branch "${TFN_REF}" --single-branch \
            "${URL}" "${DEST}" 2>/dev/null; then
            rm -rf "${DEST}"
            git clone --no-checkout "${URL}" "${DEST}"
            git -C "${DEST}" checkout "${TFN_REF}"
          fi

      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Nim trace writer artifacts (sibling)
        run: |
          nix develop --accept-flake-config --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = builtins.currentSystem; };
            in
              pkgs.mkShell {
                packages = [
                  pkgs.nim
                  pkgs.nimble
                  pkgs.zstd
                  pkgs.gcc
                ];
              }
          ' -c bash -c '
              set -euo pipefail
              cd "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"
              nimble install -y --depsOnly
              nimble buildStaticLib
              nimble buildCtPrint
              test -f libcodetracer_trace_writer.a
              test -x ct-print
            '
          echo "CODETRACER_NIM_LIB_DIR=${GITHUB_WORKSPACE}/../codetracer-trace-format-nim" >> "$GITHUB_ENV"

      - name: Lint
        run: dev-exec just lint

      - name: Test
        run: dev-exec just test

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: target/
          retention-days: 7
